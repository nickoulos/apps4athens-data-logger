# Collects Attica traffic (every minute) and ΜΥΦΑΗ chargers (every 10 min).
# STASY elevators are not collected here: stasy.gr answers 403 to GitHub's IP ranges.
# One run = 5 segments of ~68 min; each segment uploads its data as an artifact, so a lost
# runner costs at most one segment. Each run queues its successor as its first step (the
# concurrency group holds it until this run ends), so the chain does not depend on GitHub's
# cron, which in practice fires only every 3–5 h. The hourly cron restarts the chain if it breaks.
name: logger

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      segment_minutes:
        description: "Minutes per segment (5 segments per run)"
        default: "68"

concurrency:
  group: logger
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # to queue the next run

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      SEG: ${{ inputs.segment_minutes || '68' }}
      A4A_STATE: /tmp/a4a/state
      A4A_LOOP_JOBS: traffic,chargers   # stasy.gr returns 403 to GitHub runners; elevators are logged locally
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Queue the next run
        if: ${{ github.ref == 'refs/heads/main' }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run logger.yml -R "$GITHUB_REPOSITORY" --ref main || echo "could not queue next run; the hourly cron will"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Segment 1
        if: ${{ !cancelled() }}
        env: { A4A_DATA: /tmp/a4a/out1, A4A_LOGS: /tmp/a4a/out1/logs }
        run: python collect.py loop "$SEG"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: "data-${{ github.run_id }}-1", path: /tmp/a4a/out1, retention-days: 90, compression-level: 0, if-no-files-found: warn }

      - name: Segment 2
        if: ${{ !cancelled() }}
        env: { A4A_DATA: /tmp/a4a/out2, A4A_LOGS: /tmp/a4a/out2/logs }
        run: python collect.py loop "$SEG"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: "data-${{ github.run_id }}-2", path: /tmp/a4a/out2, retention-days: 90, compression-level: 0, if-no-files-found: warn }

      - name: Segment 3
        if: ${{ !cancelled() }}
        env: { A4A_DATA: /tmp/a4a/out3, A4A_LOGS: /tmp/a4a/out3/logs }
        run: python collect.py loop "$SEG"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: "data-${{ github.run_id }}-3", path: /tmp/a4a/out3, retention-days: 90, compression-level: 0, if-no-files-found: warn }

      - name: Segment 4
        if: ${{ !cancelled() }}
        env: { A4A_DATA: /tmp/a4a/out4, A4A_LOGS: /tmp/a4a/out4/logs }
        run: python collect.py loop "$SEG"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: "data-${{ github.run_id }}-4", path: /tmp/a4a/out4, retention-days: 90, compression-level: 0, if-no-files-found: warn }

      - name: Segment 5
        if: ${{ !cancelled() }}
        env: { A4A_DATA: /tmp/a4a/out5, A4A_LOGS: /tmp/a4a/out5/logs }
        run: python collect.py loop "$SEG"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: "data-${{ github.run_id }}-5", path: /tmp/a4a/out5, retention-days: 90, compression-level: 0, if-no-files-found: warn }
